name: Zgłoszenie błędu
description: Zgłoś powtarzalny problem z grą, dźwiękiem, grafiką lub uruchamianiem.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: Dzięki za pomoc w ulepszaniu ORBIT//04. Wypełnij pola możliwie dokładnie.
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      options:
        - Uruchamianie / instalacja
        - Gameplay
        - Grafika / interfejs
        - Dźwięk / muzyka
        - Sterowanie
        - Wydajność
        - Zapis postępu
        - Inny
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroki odtworzenia
      description: Opisz dokładnie, co zrobić od uruchomienia gry do wystąpienia błędu.
      placeholder: |
        1. Uruchom...
        2. Wybierz...
        3. Błąd pojawia się...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Oczekiwany rezultat
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Rzeczywisty rezultat
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System i sposób uruchomienia
      placeholder: Windows 11, START_ORBIT.cmd / npm.cmd start
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log lub zrzut ekranu
      description: Przeciągnij tutaj plik albo wklej pełny komunikat błędu. Usuń prywatne dane.
  - type: checkboxes
    id: checks
    attributes:
      label: Weryfikacja
      options:
        - label: Sprawdziłem, że podobne zgłoszenie nie jest już otwarte.
          required: true
        - label: Zgłoszenie nie zawiera tokenów, haseł ani prywatnych danych.
          required: true
