name: Bug report
description: Report a reproducible runtime, rendering, audio, input, or startup problem.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: Include enough information to reproduce the problem on a clean installation.
  - type: dropdown
    id: area
    attributes:
      label: Affected component
      options:
        - Startup / installation
        - Gameplay
        - Rendering / interface
        - Audio
        - Input
        - Performance
        - Save data
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List each action from startup until the problem occurs.
      placeholder: |
        1. Start the game with...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and launch method
      placeholder: Windows 11, START_ORBIT.cmd / npm.cmd start
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach the relevant file or paste the complete error output. Remove private information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I checked that an equivalent issue is not already open.
          required: true
        - label: This report contains no credentials, tokens, or private information.
          required: true
