name: Feature request
description: Propose a scoped gameplay, accessibility, rendering, audio, or tooling change.
title: "[FEATURE] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the user or developer problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected component
      options:
        - Gameplay
        - Accessibility / usability
        - Rendering / readability
        - Audio
        - Input
        - Performance
        - Tooling / tests
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and trade-offs
      description: Note any effect on balance, readability, performance, compatibility, or save data.
  - type: textarea
    id: references
    attributes:
      label: Supporting material
      description: Add technical references, diagrams, or screenshots when they clarify the proposal.
