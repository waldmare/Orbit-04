name: Propozycja funkcji
description: Zaproponuj ulepszenie gameplayu, dostępności, interfejsu lub prezentacji.
title: "[FEATURE] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Jaki problem gracza rozwiązuje ta funkcja?
      description: Opisz potrzebę, zanim przedstawisz rozwiązanie.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proponowane rozwiązanie
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      options:
        - Gameplay loop
        - QoL / dostępność
        - Grafika / czytelność
        - Audio
        - Sterowanie
        - Wydajność
        - Narzędzia / testy
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Ryzyka i kompromisy
      description: Czy zmiana wpływa na balans, czytelność, wydajność albo zapis gry?
  - type: textarea
    id: references
    attributes:
      label: Materiały pomocnicze
      description: Opcjonalne szkice, zrzuty ekranu lub przykłady podobnych rozwiązań.
